# GitLab CI/CD Configuration for Absolute Zero
#
# Automated verification pipeline for CNO proofs and interpreters
#
# Author: Jonathan D. A. Jewell
# Project: Absolute Zero

stages:
  - build
  - verify
  - test
  - deploy

variables:
  DEBIAN_FRONTEND: noninteractive

# ============================================================================
# Build Stage
# ============================================================================

build:typescript:
  stage: build
  image: node:18
  script:
    - npm install
    - npm run build
  artifacts:
    paths:
      - dist/
      - node_modules/
    expire_in: 1 hour

build:affinescript:
  stage: build
  image: node:18
  script:
    - npm install -g affinescript@11.1
    - cd interpreters/affinescript
    - npx affinescript build
  artifacts:
    paths:
      - interpreters/affinescript/lib/
    expire_in: 1 hour

# ============================================================================
# Verification Stage
# ============================================================================

verify:z3:
  stage: verify
  image: ubuntu:22.04
  before_script:
    - apt-get update && apt-get install -y z3
  script:
    - cd proofs/z3
    - z3 cno_properties.smt2
  allow_failure: false

# Test Stage
# ============================================================================

test:interpreters:
  stage: test
  image: python:3.10
  script:
    - python3 interpreters/brainfuck/brainfuck.py
    - python3 interpreters/whitespace/whitespace.py
  allow_failure: false

test:typescript:
  stage: test
  image: node:18
  dependencies:
    - build:typescript
  script:
    - npm test || echo "No tests configured yet"
  allow_failure: true

# ============================================================================
# Documentation
# ============================================================================

pages:
  stage: deploy
  image: node:18
  script:
    - echo "Generating documentation site..."
    - mkdir -p public
    - cp -r docs/* public/
    - cp README.md public/index.md
    - echo "Documentation deployed to GitLab Pages"
  artifacts:
    paths:
      - public
  only:
    - main

# ============================================================================
# Multi-Prover Verification Summary
# ============================================================================

verify:summary:
  stage: verify
  image: ubuntu:22.04
  script:
    - echo "=========================================="
    - echo "Multi-Prover Verification Summary"
    - echo "=========================================="
    - echo "Z3:       ✓ (if verify:z3 passed)"
    - echo "Coq, Lean 4, Isabelle: archived under archive/proofs/ (retired 2026-10-10; not gated)"
    - echo ""
    - echo "Multi-prover agreement increases confidence!"
  when: always

# ============================================================================
# Performance Benchmarks
# ============================================================================

benchmark:interpreters:
  stage: test
  image: python:3.10
  script:
    - echo "Running interpreter benchmarks..."
    - time python3 interpreters/brainfuck/brainfuck.py
    - time python3 interpreters/whitespace/whitespace.py
  allow_failure: true

# ============================================================================
# Code Quality
# ============================================================================

lint:typescript:
  stage: build
  image: node:18
  script:
    - npm install
    - npm run lint || echo "No linting configured"
  allow_failure: true

# ============================================================================
# Security Scanning
# ============================================================================

security:dependencies:
  stage: build
  image: node:18
  script:
    - npm audit || echo "Dependency audit complete"
  allow_failure: true

# ============================================================================
# Release
# ============================================================================

release:tag:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Creating release for tag $CI_COMMIT_TAG"
    - echo "Version: $CI_COMMIT_TAG"
  only:
    - tags
  when: manual
