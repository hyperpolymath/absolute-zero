# This workflow is managed by gh actions-lock.
# Thin wrapper around hyperpolymath/standards hypatia-scan-reusable.yml.
# See standards#191 for the reusable's purpose and design.

name: Hypatia Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

# Estate guardrail: cancel superseded runs so re-pushes don't pile up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hypatia:
    permissions:
      actions: read
      contents: read
      pull-requests: write
      security-events: write
    uses: metadatastician/standards/.github/workflows/hypatia-scan-reusable.yml@ba640e9a57f22608710ffecdca282074eac55a0b
    # Explicit secrets map, not `secrets: inherit` (Hypatia WH008, Sonar
    # S7635): the callee (standards@ba640e9) declares only this one.
    secrets:
      HYPATIA_SCAN_PAT: ${{ secrets.HYPATIA_SCAN_PAT }}
